apiVersion: v1
kind: ConfigMap
metadata:
  name: jellyfin-web-config
data:
  # Envoy configuration with native inotify watched_directory
  envoy.yaml: |
    static_resources:
      listeners:
      - name: https_listener
        address:
          socket_address:
            address: 0.0.0.0
            port_value: 8443
        filter_chains:
        - transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
              common_tls_context:
                tls_params:
                  tls_minimum_protocol_version: TLSv1_2
                  tls_maximum_protocol_version: TLSv1_3
                tls_certificates:
                - certificate_chain:
                    filename: /etc/envoy/certs/tls.crt
                  private_key:
                    filename: /etc/envoy/certs/tls.key
                  watched_directory:
                    path: /etc/envoy/certs
          filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: ingress_http
              route_config:
                name: jellyfin_route
                virtual_hosts:
                - name: jellyfin_vhost
                  domains: ["*"]
                  routes:
                  # 1. WebSocket endpoint
                  - match:
                      prefix: "/socket"
                    route:
                      cluster: jellyfin_backend
                      upgrade_configs:
                      - upgrade_type: "websocket"
                  # 2. Exact root path -> local static UI
                  - match:
                      path: "/"
                    route:
                      cluster: local_static_web
                  # 3. Static assets -> local static UI
                  - match:
                      safe_regex:
                        google_re2: {}
                        regex: '.*\.(html|js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|json|map|webmanifest)$'
                    route:
                      cluster: local_static_web
                  # 4. Fallback API and streaming endpoints -> external backend
                  - match:
                      prefix: "/"
                    route:
                      cluster: jellyfin_backend
                      timeout: 0s
              http_filters:
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
      - name: local_static_web
        connect_timeout: 0.25s
        type: STATIC
        lb_policy: ROUND_ROBIN
        load_assignment:
          cluster_name: local_static_web
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: 127.0.0.1
                    port_value: 8080
      - name: jellyfin_backend
        connect_timeout: 1.0s
        type: LOGICAL_DNS
        dns_lookup_family: V4_ONLY
        lb_policy: ROUND_ROBIN
        load_assignment:
          cluster_name: jellyfin_backend
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: <EXTERNAL_SERVER_HOST>
                    port_value: 8096

  # Lightweight local NGINX configuration for serving static SPA files only
  nginx.conf: |
    server {
        listen 127.0.0.1:8080;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
