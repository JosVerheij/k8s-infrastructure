apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jellyfin-web
  template:
    metadata:
      labels:
        app: jellyfin-web
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: extract-web-assets
          image: ghcr.io/jellyfin/jellyfin:12
          command: ["sh", "-c", "cp -a /jellyfin/jellyfin-web/. /target/"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: web-root
              mountPath: /target
      containers:
        # TLS termination & routing reverse proxy
        - name: envoy
          image: envoyproxy/envoy:distroless-v1.40-latest
          command: ["envoy"]
          args: ["-c", "/etc/envoy/envoy.yaml"]
          ports:
            - name: https
              containerPort: 8443
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: envoy-config
              mountPath: /etc/envoy
              readOnly: true
            - name: tls-certs
              mountPath: /etc/envoy/certs
              readOnly: true
            - name: envoy-tmp
              mountPath: /tmp

        # Cleartext local loopback static file server
        - name: web-static
          image: nginx/nginx-unprivileged:latest
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: web-root
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: nginx-tmp
              mountPath: /tmp
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run

      volumes:
        - name: web-root
          emptyDir: {}
        - name: tls-certs
          secret:
            secretName: jellyfin-web-tls
        - name: envoy-config
          configMap:
            name: jellyfin-web-config
            items:
              - key: envoy.yaml
                path: envoy.yaml
        - name: nginx-config
          configMap:
            name: jellyfin-web-config
            items:
              - key: nginx.conf
                path: default.conf
        - name: envoy-tmp
          emptyDir: {}
        - name: nginx-tmp
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
