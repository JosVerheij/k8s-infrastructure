apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin-server
  labels:
    app.kubernetes.io/name: jellyfin-server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: jellyfin-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jellyfin-server
    spec:
      terminationGracePeriodSeconds: 60

      automountServiceAccountToken: false

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"
        seccompProfile:
          type: RuntimeDefault

      volumes:
        - name: tls-secret
          secret:
            secretName: jellyfin-server-internal-tls
        - name: envoy-conf
          configMap:
            name: envoy-tls-config
        - name: jellyfin-server-xml-templates
          configMap:
            name: jellyfin-server-config-templates

        - name: jellyfin-server-config
          emptyDir: {}
        - name: jellyfin-server-home
          emptyDir: {}
        - name: jellyfin-server-tmp
          emptyDir: {}
        - name: jellyfin-server-cache
          emptyDir: {}
        - name: envoy-tmp
          emptyDir: {}

        # TEMP TEMP TEMP
        - name: jellyfin-server-data
          emptyDir: {}
        - name: jellyfin-media
          emptyDir: {}
          # persistentVolumeClaim

        # ENDTEMP

      initContainers:
        - name: config-bootstrap
          image: alpine:3
          command: ["/bin/sh", "-c"]
          args:
            - |
              # Copy templates directly to /config (aligned with JELLYFIN_CONFIG_DIR)
              for src in /templates/*.xml; do
                [ -e "$src" ] || continue
                filename=$(basename "$src")
                dest="/config/$filename"
                if [ ! -f "$dest" ]; then
                  cp "$src" "$dest"
                fi
              done
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: jellyfin-server-config
              mountPath: /config
            - name: jellyfin-server-xml-templates
              mountPath: /templates
              readOnly: true

        - name: tls-proxy
          image: envoyproxy/envoy:distroless-v1.40-latest
          restartPolicy: Always
          args: ["-c", "/etc/envoy/envoy.yaml"]
          ports:
            - name: https
              containerPort: 8443
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tls-secret
              mountPath: /etc/certs
              readOnly: true
            - name: envoy-conf
              mountPath: /etc/envoy
              readOnly: true
            - name: envoy-tmp
              mountPath: /tmp
          readinessProbe:
            tcpSocket:
              port: 8443
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8443
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 4

      containers:
        # Main Jellyfin Monolith
        - name: jellyfin
          image: ghcr.io/jellyfin/jellyfin:12
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 4000m
              memory: 8Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: JELLYFIN_hostwebclient
              value: "true"
            - name: HOME
              value: /home/jellyfin
            - name: DOTNET_CLI_HOME
              value: /home/jellyfin/.dotnet
            - name: JELLYFIN_CONFIG_DIR
              value: /config
            - name: JELLYFIN_DATA_DIR
              value: /config/data
            - name: JELLYFIN_LOG_DIR
              value: /config/log
            - name: JELLYFIN_CACHE_DIR
              value: /cache
          volumeMounts:
            - name: jellyfin-media
              mountPath: /media
            - name: jellyfin-server-config
              mountPath: /config
            - name: jellyfin-server-data
              mountPath: /config/data
            - name: jellyfin-server-cache
              mountPath: /cache
            - name: jellyfin-server-home
              mountPath: /home/jellyfin
            - name: jellyfin-server-tmp
              mountPath: /tmp

          startupProbe:
            httpGet:
              path: /health
              port: 8096
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 60

          readinessProbe:
            httpGet:
              path: /health
              port: 8096
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2

          livenessProbe:
            httpGet:
              path: /health
              port: 8096
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3



