---
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: "allow-argocd-internal-egress"
  namespace: argocd
spec:
  description: "Allow internal egress within argocd"
  endpointSelector:
    matchLabels: {}
  egress:
  - toEndpoints:
    - matchLabels:
        io.cilium.k8s.policy.serviceaccount: argocd-repo-server
    toPorts:
    - ports:
      - port: "8081"
        protocol: TCP

  - toEndpoints:
    - matchLabels:
        io.cilium.k8s.policy.serviceaccount: argocd-redis
    toPorts:
    - ports:
      - port: "6379"
        protocol: TCP

