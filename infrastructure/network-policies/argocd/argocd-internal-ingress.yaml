---
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: "allow-argocd-internal-ingress"
  namespace: argocd
specs:

- description: "Allow INGRESS from argo deployments"
  endpointSelector:
    matchLabels:
      io.cilium.k8s.policy.serviceaccount: argocd-repo-server
  ingress:
    - fromEndpoints:
      - matchLabels:
          io.cilium.k8s.namespace.labels.kubernetes.io/metadata.name: argocd
      toPorts:
      - ports:
        - port: "8081"
          protocol: TCP
