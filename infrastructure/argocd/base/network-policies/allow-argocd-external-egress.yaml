---
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: "allow-argocd-external-egress"
spec:
  description: "Allow traffic to selected repository domains"
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: argocd-repo-server
  egress:
  - toPorts:
    - ports:
      - port: "443"
        protocol: TCP
    toFQDNs:
    - matchName: "ghcr.io"
    - matchName: "github.com"
    - matchName: "github.io"
    - matchName: "quay.io"
    - matchName: "hub.docker.com"
    - matchPattern: "*.ghcr.io"
    - matchPattern: "*.github.com"
    - matchPattern: "*.github.io"
    - matchPattern: "*.quay.io"
    - matchPattern: "*.githubusercontent.com"

