---
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: "allow-argocd-external-egress"
spec:
  description: "Allow traffic to selected repository domains"
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: argocd-repo-server
  egress:
  - toPorts:
    - ports:
      - port: "443"
        protocol: TCP
    toFQDNs:
    - matchName: "ghcr.io"
    - matchName: "github.com"
    - matchName: "quay.io"
    - matchName: "raw.githubusercontent.com"

