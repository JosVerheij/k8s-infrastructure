apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: t1-platform  # tier-1
  namespace: argocd
spec:
  description: "Tier 1: Platform operators, security services and cluster controllers"

  sourceRepos:
    - 'https://github.com/JosVerheij/gitops-joveo.git'
    - 'oci://ghcr.io/kyverno/charts/kyverno'
    - 'oci://quay.io/jetstack/charts/cert-manager'

  destinations:
    - server: 'https://kubernetes.default.svc'
      namespace: 'cert-manager'
    - server: 'https://kubernetes.default.svc'
      namespace: 'kyverno'

  clusterResourceWhitelist:
    # CRDs owned by platform operators
    - group: 'apiextensions.k8s.io'
      kind: 'CustomResourceDefinition'

    # Cluster namespaces
    - group: ''
      kind: 'Namespace'

    # Cluster RBAC
    - group: 'rbac.authorization.k8s.io'
      kind: 'ClusterRole'
    - group: 'rbac.authorization.k8s.io'
      kind: 'ClusterRoleBinding'

    # Admission webhooks
    - group: 'admissionregistration.k8s.io'
      kind: 'MutatingWebhookConfiguration'
    - group: 'admissionregistration.k8s.io'
      kind: 'ValidatingWebhookConfiguration'

    # cert-manager cluster-wide configuration
    - group: 'cert-manager.io'
      kind: 'ClusterIssuer'

    # Kyverno cluster-wide policies
    - group: policies.kyverno.io
      kind: ValidatingPolicy
    - group: policies.kyverno.io
      kind: MutatingPolicy
    - group: policies.kyverno.io
      kind: GeneratingPolicy
    - group: policies.kyverno.io
      kind: DeletingPolicy
    - group: policies.kyverno.io
      kind: ImageValidatingPolicy


  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
