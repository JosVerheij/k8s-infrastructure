apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: apps
  namespace: argocd
spec:
  description: "Tier 3: Untrusted tenant application workloads"
  sourceRepos:
    - 'https://github.com/JosVerheij/gitops-joveo.git'
  destinations:
    - server: 'https://kubernetes.default.svc'
      namespace: 'app-*'

  # Strictly forbidden from deploying any cluster-scoped resources
  clusterResourceWhitelist: []

  namespaceResourceWhitelist:
    # Workloads
    - group: "apps"
      kind: "Deployment"
    - group: "apps"
      kind: "StatefulSet"
    - group: "batch"
      kind: "Job"
    - group: "batch"
      kind: "CronJob"
    # Basic Config & Plumbing
    - group: ""
      kind: "ConfigMap"
    - group: ""
      kind: "Secret"
    - group: ""
      kind: "ServiceAccount"
    - group: ""
      kind: "PersistentVolumeClaim"
    - group: ""
      kind: "Service"
    # Scaling & Disruption
    - group: "autoscaling"
      kind: "HorizontalPodAutoscaler"
    - group: "policy"
      kind: "PodDisruptionBudget"
