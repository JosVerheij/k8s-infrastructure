apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: workloads
  namespace: argocd
spec:
  sourceRepos:
  - '*'

  destinations:
  - server: '*'
    namespace: 'app-*'

  namespaceResourceWhitelist:
  - group: '*'
    kind: '*'

  # Blocks any cluster resource creation by app.
  clusterResourceWhitelist: []
