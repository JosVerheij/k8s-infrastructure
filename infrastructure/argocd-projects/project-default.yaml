apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: default
  namespace: argocd
spec:
  description: "Tier 1: Cluster operators, CRDs, and controllers"
  sourceRepos:
    - 'https://github.com/JosVerheij/gitops-joveo.git'
    - 'https://helm.cilium.io/'
    - 'https://kyverno.github.io/kyverno/'
  destinations:
    - server: 'https://kubernetes.default.svc'
      namespace: '*'
  # Requires full access to deploy webhooks, CRDs, and system daemonsets
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
