apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: appset-t3-tenant-workloads
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io

spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/JosVerheij/gitops-joveo.git
        revision: HEAD
        directories:
          - path: "apps/*"

  template:
    metadata:
      name: 'app-{{ .path.basename }}'
    spec:
      project: t3-workloads

      source:
        repoURL: https://github.com/JosVerheij/gitops-joveo.git
        targetRevision: HEAD
        path: '{{ .path.path }}'

      destination:
        server: 'https://kubernetes.default.svc'
        namespace: 'app-{{ .path.basename }}'

      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - ApplyOutOfSyncOnly=true
          - ServerSideApply=true
