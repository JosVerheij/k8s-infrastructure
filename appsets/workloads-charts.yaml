apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: workloads-charts
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
        - git:
            repoURL: https://github.com/josverheij/k8s-infrastructure.git
            revision: HEAD
            files:
              - path: "workloads/*/helm.yaml"
              - path: "workloads/*/*/**/helm.yaml"
                exclude: true
              - path: "workloads/*/*/helm.yaml"
                exclude: true
        - clusters: {}
  template:
    metadata:
      name: 'app-{{ .path.basename }}-chart'
    spec:
      project: workloads
      sources:
        - repoURL: '{{ .source.repoURL }}'
          targetRevision: '{{ .source.targetRevision }}'
          chart: '{{ dig "source" "chart" "" . | default "" }}'
          path: '{{ dig "source" "path" "" . | default "." }}'
          helm:
            ignoreMissingValueFiles: true
            valueFiles:
              - '$git-values/{{ .path.path }}/values/values.yaml'
              - '$git-values/{{ .path.path }}/values/values-{{ .name }}.yaml'
        - repoURL: https://github.com/josverheij/k8s-infrastructure.git
          targetRevision: HEAD
          ref: git-values
      destination:
        server: '{{ .server }}'
        namespace: 'app-{{ .path.basename }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          # - CreateNamespace=true
          - ApplyOutOfSyncOnly=true
          - ServerSideApply=true
