apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: appset-t0-infrastructure-kustomize
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io

spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]

  # Preserve deployed resources if this ApplicationSet is deleted.
  # syncPolicy:
  #   preserveResourcesOnDeletion: true

  generators:
    - matrix:
        generators:
          - git:
              repoURL: https://github.com/JosVerheij/gitops-joveo.git
              revision: HEAD
              files:
                - path: "infrastructure/*/kustomization.yaml"
                - path: "infrastructure/*/*/**/kustomization.yaml"
                  exclude: true
                - path: "infrastructure/*/*/kustomization.yaml"
                  exclude: true

          - clusters: {}

  template:
    metadata:
      name: 'infra-{{ .path.basename }}'

    spec:
      project: t0-infrastructure

      source:
        repoURL: https://github.com/JosVerheij/gitops-joveo.git
        targetRevision: HEAD
        path: '{{ .path.path }}'
        kustomize:
          ignoreMissingComponents: true
          components:
            - clusters/{{ .name }}

      destination:
        server: '{{ .server }}'
        namespace: '{{ if hasKey . "namespace" }}{{ .namespace }}{{ else }}{{ .path.basename }}{{ end }}'

      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ApplyOutOfSyncOnly=true
          - ServerSideApply=true
